<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Krishna ❤️ Gowthami Wedding</title>

<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

<style>
body {
    margin: 0;
    font-family: 'Poppins', sans-serif;
    background: linear-gradient(to bottom, #fff5f7, #fff);
    text-align: center;
    overflow-x: hidden;
}

/* Hero */
.hero {
    padding: 80px 20px;
}

.hero h1 {
    font-family: 'Great Vibes', cursive;
    font-size: 50px;
    color: #c2185b;
}

.hero p {
    font-size: 20px;
}

/* Details */
.section {
    padding: 40px 20px;
}

.title {
    font-family: 'Great Vibes', cursive;
    font-size: 34px;
    color: #c2185b;
    margin-bottom: 20px;
}

/* Button */
.btn {
    background: #c2185b;
    color: white;
    padding: 12px 20px;
    border-radius: 8px;
    text-decoration: none;
    display: inline-block;
    margin-top: 10px;
}

/* Floating flowers */
.flower {
    position: fixed;
    width: 40px;
    animation: fall 10s linear infinite;
}

@keyframes fall {
    from { transform: translateY(-50px); }
    to { transform: translateY(100vh); }
}

/* Popup */
.popup {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    background: rgba(0,0,0,0.6);
    display: flex;
    justify-content: center;
    align-items: center;
}

.popup-content {
    background: white;
    padding: 30px;
    border-radius: 12px;
    text-align: center;
}

footer {
    padding: 20px;
    background: #ffe4ec;
}
</style>
</head>

<body>

<!-- Background Music -->
<audio autoplay loop>
  <source src="https://www2.cs.uic.edu/~i101/SoundFiles/PachelbelCanon.mp3" type="audio/mpeg">
</audio>

<!-- Welcome Popup -->
<div class="popup" id="popup">
    <div class="popup-content">
        <h2>You're Invited!</h2>
        <p>Krishna ❤️ Gowthami Wedding</p>
        <button class="btn" onclick="closePopup()">Open Invitation</button>
    </div>
</div>

<!-- Floating Flowers -->
<img src="https://pngimg.com/uploads/flower/flower_PNG102.png" class="flower" style="left:10%">
<img src="https://pngimg.com/uploads/flower/flower_PNG102.png" class="flower" style="left:40%; animation-delay:3s">
<img src="https://pngimg.com/uploads/flower/flower_PNG102.png" class="flower" style="left:70%; animation-delay:6s">

<!-- Hero -->
<div class="hero">
    <h1>Krishna & Gowthami</h1>
    <p>June 15, 2026 | 10:45 AM</p>
</div>

<!-- Wedding Details -->
<div class="section">
    <div class="title">Wedding Details</div>
    <p><b>Venue:</b> Sri Convention Hall</p>
    <p><b>City:</b> Hyderabad</p>

    <!-- Google Maps -->
    <a class="btn" 
       href="https://www.google.com/maps/search/?api=1&query=Sri+Convention+Hall+Hyderabad" 
       target="_blank">
       View Location
    </a>
</div>

<!-- QR Code Section -->
<div class="section">
    <div class="title">Scan & Open Invitation</div>
    <img src="https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=PUT_YOUR_WEBSITE_LINK_HERE">
</div>

<footer>
    With Love ❤️ Krishna & Gowthami
</footer>

<script>
function closePopup() {
    document.getElementById("popup").style.display = "none";
}
</script>

</body>
</html>
